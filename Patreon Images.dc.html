<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&amp;family=PT+Serif:ital,wght@0,400;0,700;1,400&amp;family=PT+Sans:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0}
</style>
</helmet>
<div style="min-height:100vh;background:linear-gradient(178deg,#eef2ec 0%,#f2ede2 100%);font-family:'PT Sans',system-ui,sans-serif;color:#2E2B26;padding:56px 48px 80px">
  <div style="max-width:1180px;margin:0 auto">

    <!-- masthead -->
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <span style="width:13px;height:13px;border-radius:50%;background:#8a6a2f"></span>
      <span style="width:13px;height:13px;border-radius:50%;background:#4f6a60"></span>
      <span style="width:13px;height:13px;border-radius:50%;background:#5f7a3a"></span>
      <span style="width:13px;height:13px;border-radius:50%;background:#b07a3c"></span>
      <span style="width:13px;height:13px;border-radius:50%;background:#a8542d"></span>
      <span style="width:13px;height:13px;border-radius:50%;background:#3f6e74"></span>
      <span style="font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#5c6f68;margin-left:6px">Systems Learning Lab · Patreon</span>
    </div>
    <h1 style="font-family:'Newsreader',serif;font-weight:500;font-size:44px;line-height:1.03;letter-spacing:-.01em;margin:0;color:#1f3a36">Patreon image library</h1>
    <p style="font-family:'PT Serif',serif;font-style:italic;font-size:16px;color:#4c6b64;margin:8px 0 44px;max-width:60ch">Every image made for the page, grouped by use, so the visual language stays consistent. Newest at the top of each group.</p>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div style="margin-bottom:52px">
        <div style="display:flex;align-items:baseline;gap:12px;border-bottom:1px solid rgba(70,81,74,.22);padding-bottom:9px;margin-bottom:22px">
          <span style="width:10px;height:10px;border-radius:50%;flex:none;background:{{ g.dot }}"></span>
          <h2 style="font-family:'Newsreader',serif;font-weight:500;font-size:24px;margin:0;color:#2f4a44">{{ g.title }}</h2>
          <span style="font-family:'PT Serif',serif;font-style:italic;font-size:14px;color:#7a6f5c">{{ g.note }}</span>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:26px">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2">
            <div style="display:flex;flex-direction:column;background:#FCFBF7;border:1px solid rgba(70,81,74,.14);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(60,74,69,.06)">
              <div style="position:relative;background:repeating-conic-gradient(#eee 0% 25%, #f7f7f4 0% 50%) 50%/18px 18px">
                <img src="{{ it.src }}" alt="{{ it.name }}" style="display:block;width:100%;height:auto"></img>
                <span style="position:absolute;top:10px;right:10px;background:rgba(31,58,54,.86);color:#f3efe6;font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:20px">{{ it.dims }}</span>
              </div>
              <div style="padding:14px 16px 16px">
                <div style="font-family:'PT Serif',serif;font-weight:700;font-size:15.5px;color:#2f4a44">{{ it.name }}</div>
                <div style="font-size:12.5px;line-height:1.5;color:#7a6f5c;margin-top:3px">{{ it.desc }}</div>
                <div style="font-family:'PT Sans',monospace;font-size:11px;color:#9a8f7c;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:12px">{{ it.file }}</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
                  <button onClick="{{ it.onDownload }}" style="display:inline-flex;align-items:center;gap:6px;flex:1;justify-content:center;background:#2f4a44;color:#f3efe6;font-family:'PT Sans',sans-serif;font-size:12px;font-weight:700;letter-spacing:.02em;border:0;cursor:pointer;padding:8px 13px;border-radius:20px" style-hover="background:#1f3a36">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="M7 11l5 4 5-4"></path><path d="M5 21h14"></path></svg>
                    <span>Download PNG</span>
                  </button>
                  <button onClick="{{ it.onDelete }}" title="Remove from library" style="display:inline-flex;align-items:center;gap:6px;flex:none;background:#fff;color:#a8542d;font-family:'PT Sans',sans-serif;font-size:12px;font-weight:700;border:1px solid rgba(168,84,45,.4);cursor:pointer;padding:8px 12px;border-radius:20px" style-hover="background:#a8542d">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M6 6l1 14h10l1-14"></path></svg>
                    <span>Delete</span>
                  </button>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { hidden: (() => { try { return JSON.parse(localStorage.getItem('pat-img-hidden') || '[]'); } catch (e) { return []; } })() };

  async download(src, file) {
    try {
      const res = await fetch(src, { cache: 'no-store' });
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = file || 'image.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } catch (e) {
      window.open(src, '_blank');
    }
  }

  hide(file) {
    this.setState(s => {
      const hidden = s.hidden.includes(file) ? s.hidden : [...s.hidden, file];
      try { localStorage.setItem('pat-img-hidden', JSON.stringify(hidden)); } catch (e) {}
      return { hidden };
    });
  }

  renderVals() {
    const hidden = this.state.hidden || [];
    const raw = [
        {
          title: 'Page header / banner',
          note: 'the cover behind the profile',
          dot: '#4f6a60',
          items: [
            { name: 'Banner — wide, plain', dims: '2560 × 1024', src: 'patreon-header-2560x1024.png', file: 'patreon-header-2560x1024.png', desc: 'Recommended upload. Four-island map with journey path and compass; open center for Patreon\u2019s title overlay.' },
            { name: 'Banner — plain', dims: '1500 × 900', src: 'patreon-header-plain-1500x900.png', file: 'patreon-header-plain-1500x900.png', desc: 'Same scene without text, standard size.' },
            { name: 'Banner — with title', dims: '1500 × 900', src: 'patreon-header-1500x900.png', file: 'patreon-header-1500x900.png', desc: 'Islands scene with baked-in title and byline. Superseded by the plain versions once Patreon overlays its own text.' },
          ],
        },
        {
          title: 'First post — Welcome',
          note: 'the launch post image',
          dot: '#5f7a3a',
          items: [
            { name: 'Welcome — with characters (v2)', dims: '1600 × 900', src: 'welcome-characters-v2-1600x900.png', file: 'welcome-characters-v2-1600x900.png', desc: 'Folk block-print characters of the two of us on the home island, journey path toward the archipelago, folk sun. True 16:9 so Patreon shows it full-bleed (no side border). Current direction.' },
            { name: '\u201CThe journey begins here\u201D', dims: '1500 × 900', src: 'patreon-welcome-1500x900.png', file: 'patreon-welcome-1500x900.png', desc: 'Foreground start island with a \u201CYou are here\u201D waypoint, path setting off toward faint destination islands. Headline + byline.' },
          ],
        },
      ];

    const groups = raw
      .map(g => ({
        ...g,
        items: g.items
          .filter(it => !hidden.includes(it.file))
          .map(it => ({
            ...it,
            onDownload: () => this.download(it.src, it.file),
            onDelete: () => this.hide(it.file),
          })),
      }))
      .filter(g => g.items.length > 0);

    return { groups };
  }
}
</script>
</body>
</html>
