<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
</helmet>
<nav style="position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px 26px;flex-wrap:wrap;padding:16px 30px;background:rgba(247,248,243,0.62);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.55);box-shadow:0 1px 0 rgba(70,90,85,.06),0 6px 22px rgba(60,90,85,.05);font-family:'PT Sans',system-ui,sans-serif">
  <span style="margin-right:auto"></span>
  <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
    <sc-for list="{{ navItems }}" as="it" hint-placeholder-count="4">
      <a href="{{ it.href }}" style="{{ it.style }}">{{ it.label }}</a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;resources&quot;,&quot;descriptors&quot;,&quot;about&quot;,&quot;engage&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const active = this.props.active || '';
    const base = { fontFamily:"'PT Sans',sans-serif", fontSize:'13px', fontWeight:700, letterSpacing:'.02em', textDecoration:'none', color:'#5f7a73', padding:'5px 0', borderBottom:'2px solid transparent', whiteSpace:'nowrap' };
    const on = Object.assign({}, base, { color:'#1f3a36', borderBottom:'2px solid #46716f' });
    const items = [
      { key:'home', label:'Home', href:'index.html' },
      { key:'descriptors', label:'Learning Goals', href:'descriptors.html' },
      { key:'about', label:'Meta-process', href:'metaprocess.html' },
      { key:'resources', label:'Resource Library', href:'resources.html' },
      { key:'engage', label:'Partner with Us', href:'engage.html' }
    ];
    return { navItems: items.map(it => ({ label:it.label, href:it.href, style: active===it.key ? on : base })) };
  }
}
</script>
</body>
</html>
